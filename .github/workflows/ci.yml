name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20, 22]
        env:
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            PUPPETEER_CACHE_DIR: ${{ github.workspace }}/puppeteer-cache
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - uses: actions/cache@v4
              with:
                  path: puppeteer-cache
                  key: ${{ runner.os }}-node-${{ matrix.node }}-puppeteer-${{ hashFiles('package-lock.json') }}
            - run: npm ci --ignore-scripts
            - run: npm test
            - run: npm run test:contract
            - run: npm run test:provider-network
            - run: npm run test:provider-timeout
            - run: npm run check:dom
            - run: npm run verify:quality
            - run: npm run verify:pptx:baseline
              env:
                  NODE_ENV: test
                  GEMINI_API_KEY: ci-stub
                  AEDOS_TEST_STUB_PROVIDERS: '1'
            - run: npm run check:baseline:export
            # Visual and PDF baselines are intentionally excluded: their fonts,
            # Chromium rendering, and generated output are Windows-specific here.
