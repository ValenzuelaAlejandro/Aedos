name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22.x', '24.x']
        env:
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            PUPPETEER_CACHE_DIR: ${{ github.workspace }}/puppeteer-cache
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - name: Verify Node.js runtime
              run: |
                  node --version
                  node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 8)) throw new Error('Aedos requires Node.js >=22.8.0')"
                  node --experimental-test-isolation=none --test --test-force-exit tests/contracts/stub-guard.test.js
            - uses: actions/cache@v4
              with:
                  path: puppeteer-cache
                  key: ${{ runner.os }}-node-${{ matrix.node }}-puppeteer-${{ hashFiles('package-lock.json') }}
            - run: npm ci --ignore-scripts
            - run: npm test
            - run: npm run test:contract
            - run: npm run test:provider-network
            - run: npm run test:provider-timeout
            - run: npm run check:dom
            - run: npm run verify:quality
            - run: npm run verify:pptx:baseline
              env:
                  NODE_ENV: test
                  GEMINI_API_KEY: ci-stub
                  AEDOS_TEST_STUB_PROVIDERS: '1'
            # Visual and PDF baselines are intentionally excluded: their fonts,
            # Chromium rendering, and generated output are Windows-specific here.

    export-baseline:
        runs-on: windows-latest
        env:
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            PUPPETEER_CACHE_DIR: ${{ github.workspace }}/puppeteer-cache
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  cache: npm
            - uses: actions/cache@v4
              with:
                  path: puppeteer-cache
                  key: ${{ runner.os }}-node-24.x-puppeteer-${{ hashFiles('package-lock.json') }}
            - run: npm ci --ignore-scripts
            # PPTX slide XML includes browser-measured geometry; compare against
            # the committed baseline on Windows to keep fonts/layout consistent.
            - run: npm run check:baseline:export
