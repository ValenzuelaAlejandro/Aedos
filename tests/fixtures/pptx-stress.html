<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0f172a}section.s{width:1122px;height:631px;box-sizing:border-box;padding:42px;background:#0f172a;color:#e2e8f0;font:18px Arial}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.card{height:190px;padding:18px;box-sizing:border-box;border:2px solid #334155;border-radius:18px;background:linear-gradient(135deg,#172554,#312e81);box-shadow:0 10px 20px rgba(0,0,0,.4)}.card img{width:180px;height:130px;object-fit:cover;float:right;border-radius:12px}.tag{display:inline-block;padding:6px 10px;border:1px solid #67e8f9;border-radius:999px;color:#a5f3fc}.bar{height:8px;margin-top:18px;background:linear-gradient(90deg,#22d3ee,#a78bfa);border-radius:8px}</style></head><body><script>
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220"><rect width="360" height="220" fill="#0ea5e9"/><circle cx="90" cy="110" r="70" fill="#fef08a"/><path d="M180 0L360 220M360 0L180 220" stroke="#e0f2fe" stroke-width="12"/></svg>`;
const src='data:image/svg+xml,'+encodeURIComponent(svg);
for(let i=1;i<=32;i++)document.body.insertAdjacentHTML('beforeend',`<section class="s"><h1>Stress slide ${i}</h1><p>Repeated editable content with a different index and a stable layout.</p><div class="grid"><div class="card"><span class="tag">case ${i}</span><div class="bar"></div><img alt="stress image ${i}" src="${src}"></div><div class="card"><strong>Operational note</strong><p>Images, gradients, shadows and text stay in the same stacking order.</p><div class="bar"></div></div></div></section>`);
</script></body></html>
